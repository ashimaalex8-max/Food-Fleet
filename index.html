<!doctype html><html><head><title>FoodFleet</title></head><body><h1>FoodFleet Dashboard</h1><p>Hybrid MySQL + MongoDB analytics</p><button onclick="load()">Refresh dashboard</button><pre id="out"></pre><script>async function load(){let paths=['restaurants','menus','analytics','ratings'];let result={};for(let p of paths){let r=await fetch('/api/'+p);result[p]=await r.json()}document.getElementById('out').textContent=JSON.stringify(result,null,2)}load()</script></body></html>
